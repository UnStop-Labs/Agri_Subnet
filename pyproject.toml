[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irrigation-subnet"
version = "1.1.0"
description = "Field Irrigation Intelligence Network — Bittensor Subnet"
requires-python = ">=3.10"
dependencies = [
    "bittensor>=6.9.0",
    "rasterio>=1.3.9",
    "numpy>=1.26.0",
    "shapely>=2.0.3",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "loguru>=0.7.2",
    "docker>=7.0.0",
    "scipy>=1.12.0",
    "pyproj>=3.6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["irrigation*", "miner*", "validator*", "neurons*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
